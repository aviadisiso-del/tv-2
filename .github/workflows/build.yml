name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: GlassLauncher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: |
          set +e
          gradle assembleRelease --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            {
              grep -E '^e: ' build.log | head -25
              grep -A8 'What went wrong' build.log | head -14
            } | sed 's#file:///home/runner/work/tv-2/tv-2/GlassLauncher/##; s/%/%25/g' \
              | awk 'BEGIN{ORS="%0A"}{print}' > errors.txt
            echo "::error title=BUILD ERRORS::$(cat errors.txt)"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: GlassLauncher/app/build/outputs/apk/release/app-release.apk
